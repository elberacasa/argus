<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 654" width="1000" height="654" role="img"><title>Workbench: Argus and Claude in Chrome on fourteen realistic tasks</title><rect x="0.5" y="0.5" width="999" height="653" rx="18" fill="#101418" stroke="rgba(255,255,255,0.09)"/><text x="28" y="44" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ecebe6" text-anchor="start">The same tasks, the same model, three ways to drive a browser</text><text x="28" y="68" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#98a1a9" text-anchor="start">Claude Opus 5 on the Workbench app. Every goal is judged from the server&#x27;s own record of what happened.</text><text x="300" y="96" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#98a1a9" text-anchor="start">Correct</text><text x="300" y="116" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ecebe6" text-anchor="start">14/14</text><text x="300" y="134" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#ecebe6" text-anchor="start">14/14</text><text x="300" y="152" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#ecebe6" text-anchor="start">12/14</text><text x="440" y="96" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#98a1a9" text-anchor="start">False successes</text><text x="440" y="116" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ecebe6" text-anchor="start