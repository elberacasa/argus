<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 168" width="1000" height="168" role="img"><title>Argus in four measured numbers</title><rect x="0.5" y="0.5" width="999" height="167" rx="18" fill="#101418" stroke="rgba(255,255,255,0.09)"/><rect x="20.0" y="20" width="229.5" height="128" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.09)"/><text x="38.0" y="76" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#3ccbb8" text-anchor="start" >0</text><text x="38.0" y="106" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ecebe6" text-anchor="start" >false successes</text><text x="38.0" y="130" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#98a1a9" text-anchor="start" >UI Testing Playground</text><rect x="263.5" y="20" width="229.5" height="128" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.09)"/><text x="281.5" y="76" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#ecebe6" text-anchor="start" >~105</text><text x="281.5" y="106" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ecebe6" text-anchor="start" >tokens per action</text><text x="281.5" y="130" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#98a1a9" text-anchor="start" >vs 1,334 per screenshot</text><rect x="507.0" y="20" width="229.5" height="128" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.09)"/><text x="525.0" y="76" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#ecebe6" text-anchor="start" >3 ms</text><text x="525.0" y="106" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ecebe6" text-anchor="start" >to explain a blocked click</text><text x="525.0" y="130" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#98a1a9" text-anchor="start" >names what is on top</text><rect x="750.5" y="20" width="229.5" height="128" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.09)"/><text x="768.5" y="76" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#ecebe6" text-anchor="start" >1–2 ms</text><text x="768.5" y="106" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ecebe6" text-anchor="start" >real click in a nest</text><text x="768.5" y="130" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#98a1a9" text-anchor="start" >yours never moves</text></svg>
