<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img"><title>Agents connect over MCP or the CLI to argusd, which drives browser lanes, desks, nests and your own Chromium</title><rect x="0.5" y="0.5" width="999" height="439" rx="18" fill="#101418" stroke="rgba(255,255,255,0.09)"/><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#5d666e"/></marker></defs><text x="28" y="44" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ecebe6" text-anchor="start" >How Argus fits together</text><rect x="28" y="84" width="168" height="56" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.09)"/><text x="112" y="118" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ecebe6" text-anchor="middle" >Claude Code</text><path d="M196 112 C248.0 112 248.0 238 300 238" fill="none" stroke="#5d666e" stroke-width="1.5" marker-end="url(#head)"/><rect x="28" y="160" width="168" height="56" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.09)"/><text x="112" y="194" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ecebe6" text-anchor="middle" >opencode</text><path d="M196 188 C248.0 188 248.0 238 300 238" fill="none" stroke="#5d666e" stroke-width="1.5" marker-end="url(#head)"/><rect x="28" y="236" width="168" height="56" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.09)"/><text x="112" y="270" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ecebe6" text-anchor="middle" >Codex</text><path d="M196 264 C248.0 264 248.0 238 300 238" fill="none" stroke="#5d666e" stroke-width="1.5" marker-end="