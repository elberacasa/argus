anchor="start" >nested Hyprland, own mouse</text><rect x="878" y="256" width="80" height="22" rx="11" fill="rgba(60,203,184,0.12)" stroke="rgba(60,203,184,0.45)"/><text x="918" y="271" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#3ccbb8" text-anchor="middle" >live in bar</text><path d="M594 238 C646.0 238 646.0 278 698 278" fill="none" stroke="#5d666e" stroke-width="1.5" marker-end="url(#head)"/><rect x="700" y="330" width="272" height="68" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.09)" stroke-width="1"/><text x="716" y="358" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ecebe6" text-anchor="start" >Your Chromium</text><text x="716" y="380" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#98a1a9" text-anchor="start" >only tabs Argus opened</text><path d="M594 238 C646.0 238 646.0 364 698 364" fill="none" stroke="#5d666e" stroke-width="1.5" marker-end="url(#head)"/><text x="28" y="414" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#98a1a9" text-anchor="start" >Desks and nests are watched live from the Omarchy bar, view-only; their work never reaches the person&#x27;s screen, focus or cursor.</text></svg>
